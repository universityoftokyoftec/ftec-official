name: Deploy F-tec site with inline hotfix

on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'ftec_hotfix/**'
      - '.github/workflows/deploy-ftec-hotfix-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build site and inline hotfix
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '_site/' \
            --exclude '*.zip'

          # Inline CSS/JS into every generated HTML. No runtime request to /ftec_hotfix is required.
          python3 ftec_hotfix/build_hotfix_site.py _site

          # Also keep diagnostic copies publicly available.
          mkdir -p _site/ftec_hotfix
          cp ftec_hotfix/ftec-hotfix.css _site/ftec_hotfix/ftec-hotfix.css
          cp ftec_hotfix/ftec-hotfix.js _site/ftec_hotfix/ftec-hotfix.js

          test -f _site/.nojekyll
          test -f _site/ftec_hotfix/ftec-hotfix.css
          test -f _site/ftec_hotfix/ftec-hotfix.js
          grep -q 'id="ftec-hotfix-inline"' _site/index.html
          grep -q 'data-version="20260802-15"' _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
