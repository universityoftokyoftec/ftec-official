name: Update latest note posts

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'

permissions:
  contents: write

concurrency:
  group: update-latest-note
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Fetch note RSS and cache header images
        run: python scripts/update_note.py

      - name: Commit updated data and images when changed
        shell: bash
        run: |
          if git diff --quiet -- assets/note-latest.json assets/note-images; then
            echo "No note update detected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/note-latest.json assets/note-images
          git commit -m "Update latest note posts and images"
          git push
