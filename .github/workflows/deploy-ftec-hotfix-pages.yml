name: Deploy F-tec site with hotfix

on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'ftec_hotfix/**'
      - '.github/workflows/deploy-ftec-hotfix-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare patched site
        run: |
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '_site/' \
            --exclude 'ftec_hotfix/build_hotfix_site.py' \
            --exclude '*.zip'
          python3 ftec_hotfix/build_hotfix_site.py _site
          test -f _site/ftec_hotfix/ftec-hotfix.css
          test -f _site/ftec_hotfix/ftec-hotfix.js
          grep -q 'data-ftec-patch="css"' _site/index.html
          grep -q 'data-ftec-patch="js"' _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
